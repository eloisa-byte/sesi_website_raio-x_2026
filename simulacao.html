<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Simulação de Raio-X 2D</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #eef2f6;
            --fg: #10202e;
            --card: #fff;
            --bd: #c9d4de
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b1118;
                --fg: #d7e6f3;
                --card: #121c26;
                --bd: #25384a
            }
        }

        :root[data-theme="dark"] {
            --bg: #0b1118;
            --fg: #d7e6f3;
            --card: #121c26;
            --bd: #25384a
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            gap: 12px
        }

        h1 {
            font-size: 1.2rem;
            margin: 0
        }

        .wrap {
            width: 100%;
            max-width: 960px;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 8px
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            touch-action: none;
            cursor: grab
        }

        .bar {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            font-size: .9rem
        }

        .bar label {
            display: flex;
            gap: 6px;
            align-items: center
        }

        select,
        button {
            font-size: .9rem;
            border-radius: 8px;
            border: 1px solid var(--bd);
            padding: 7px 10px;
            background: var(--card);
            color: var(--fg)
        }

        button {
            background: #1d6fb8;
            color: #fff;
            border: 0;
            cursor: pointer
        }
    </style>
</head>

<body>
    <h1>Simulação de Raio-X 2D</h1>
    <div class="wrap"><canvas id="c" width="960" height="540"></canvas></div>
    <div class="bar">
        <label>Parte do corpo
            <select id="part">
                <optgroup label="Humano">
                    <option value="hand">Mão</option>
                    <option value="foot">Pé</option>
                    <option value="skull">Crânio</option>
                    <option value="torso">Tórax</option>
                </optgroup>
                <optgroup label="Animais">
                    <option value="rato">Pignata</option>
                    <option value="porco">Porco</option>
                    <option value="galinha">Galinha</option>
                    <option value="peixe">Peixe</option>
                    <option value="cobra">Cobra</option>
                </optgroup>
            </select></label>
        <label>Cor
            <select id="col">
                <option value="azul">Azul</option>
                <option value="verde">Verde</option>
                <option value="ambar">Âmbar</option>
                <option value="mono">Branco</option>
            </select></label>
        <label><input type="checkbox" id="anim" checked> Animação</label>
        <label><input type="checkbox" id="snd"> Som</label>
        <button id="demo">Demo automático</button>
    </div>
    <div class="bar">Arraste o corpo até a área do scanner.</div>
